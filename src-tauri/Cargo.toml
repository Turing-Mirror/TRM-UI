[package]
name = "trm-ui"
version = "0.1.0"
description = "TRM UI — Turing Mirror 桌面壳模板"
authors = ["Turing Mirror Software"]
license = "MIT"
edition = "2021"

[lib]
name = "trm_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# 进程/窗口相关的 Win32 调用。无边框窗口的圆角、最大化钳制、开机自启都要它。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  # 开机自启：HKCU\...\Run 的读写。RegCreateKeyExW 引用 SECURITY_ATTRIBUTES。
  "Win32_System_Registry",
  "Win32_Security",
  # 无边框窗口的圆角靠 DWM 属性，不靠透明窗口 + CSS 圆角 —— 后者会连系统
  # 投影一起丢掉，四角还会露出锯齿。
  "Win32_Graphics_Dwm",
  # Win10 上 DWM 那条属性不存在，兜底靠 SetWindowRgn 自己裁圆角。
  # SetWindowRgn 虽然是 user32 的函数，windows-sys 把它归在 Gdi 这个 feature 下。
  "Win32_Graphics_Gdi",
  # Win10 要回系统投影：DwmExtendFrameIntoClientArea 的 MARGINS 在 Controls 下。
  "Win32_UI_Controls",
  # 无边框窗口的样式与最大化矩形：GetWindowLong / SetWindowPos / MINMAXINFO。
  "Win32_UI_WindowsAndMessaging",
  # 无边框最大化：子类化 WM_GETMINMAXINFO / WM_WINDOWPOSCHANGING / WM_NCCALCSIZE。
  "Win32_UI_Shell",
] }
